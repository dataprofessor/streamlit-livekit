[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-livekit"
version = "0.1.0"
description = "Talk to a LiveKit voice agent from a Streamlit app"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chanin Nantasenamat", email = "dataprofessorofficial@gmail.com" }]
keywords = ["streamlit", "livekit", "voice", "agents", "webrtc", "component"]
classifiers = [
    "Framework :: Streamlit",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "livekit-api>=1.0",
    "streamlit>=1.51",
]

[project.urls]
Homepage = "https://github.com/dataprofessor/streamlit-livekit"
Issues = "https://github.com/dataprofessor/streamlit-livekit/issues"

[dependency-groups]
dev = ["ruff"]

[tool.setuptools.packages.find]
include = ["streamlit_livekit*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# The frontend assets and the component manifest must ship with the package
streamlit_livekit = ["frontend/*", "pyproject.toml"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
