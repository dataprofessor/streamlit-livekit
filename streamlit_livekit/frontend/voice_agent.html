<div class="voice-agent">
  <div class="controls">
    <button class="toggle primary">Start conversation</button>
    <button class="mute secondary" disabled>Mute</button>
    <span class="status">Not connected</span>
  </div>
  <div class="meters">
    <div class="meter user">
      <div class="label"><span class="who">You</span><span class="state"></span></div>
      <canvas></canvas>
    </div>
    <div class="meter agent">
      <div class="label"><span class="who">Agent</span><span class="state"></span></div>
      <canvas></canvas>
    </div>
  </div>
  <div class="transcript"></div>
</div>
